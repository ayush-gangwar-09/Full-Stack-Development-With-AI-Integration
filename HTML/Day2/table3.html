<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TWO TABLE</title>
    <style>
        table{
            border-collapse: collapse;
            margin: auto;
        }
        table table{
            margin: 10px;
        }
        td{
            border:1px solid black;
            width:50px;
            height:50px;
            text-align: center;
            font-size:18px;
            font-weight: bold;

        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td>
                <table>
                    <tr>
                        <td colspan="4">1</td>
                    </tr>
                    <tr>
                        <td rowspan="2">2</td>
                        <td>3</td>
                        <td rowspan="2">4</td>
                        <td>5</td>
                    </tr>
                    <tr>
                        <td>6</td>
                        <td>7</td>
                    </tr>
                    <tr>
                        <td colspan="2">8</td>
                        <td>9</td>
                        <td>10</td>
                    </tr>
                </table>
            </td>
            <td>
                <table>
                    <tr>
                        <td rowspan="2">1</td>
                        <td>2</td>
                        <td rowspan="2">3</td>
                        <td>4</td>
                    </tr>
                    <tr>
                        <td>5</td>
                        <td>6</td>
                    </tr>
                    <tr>
                        <td colspan="4">7</td>
                    </tr>
                    <tr>
                        <td>8</td>
                        <td rowspan="2">9</td>
                        <td>10</td>
                        <td rowspan="2">11</td>
                    </tr>
                    <tr>
                        <td>12</td>
                        <td>13</td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
